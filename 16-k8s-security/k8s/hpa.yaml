# HorizontalPodAutoscaler — scale khi bị DDoS (tăng capacity)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secure-api-hpa
  namespace: security-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secure-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
