# App demo — FastAPI có WAF middleware (chống SQLi + rate limit)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-api
  namespace: security-lab
  labels:
    app: secure-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-api
  template:
    metadata:
      labels:
        app: secure-api
    spec:
      # Security context — không chạy root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install -q fastapi uvicorn && \
              cd /app && \
              uvicorn main:app --host 0.0.0.0 --port 8080
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app-code
              mountPath: /app
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: app-code
          configMap:
            name: secure-api-code
