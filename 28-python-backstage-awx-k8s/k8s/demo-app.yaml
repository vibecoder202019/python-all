apiVersion: v1
kind: Namespace
metadata:
  name: platform-apps
  labels:
    platform.mlops/module: "28"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: platform-apps
  labels:
    app: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: platform-apps
spec:
  selector:
    app: demo-api
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
