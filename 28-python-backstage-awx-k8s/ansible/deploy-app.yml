---
# Deploy app lên Kubernetes — chạy bởi AWX Job Template "Deploy microservice".
# Extra vars từ Bridge / Backstage:
#   app_name, namespace, image, replicas [, cluster_context]
- name: Deploy application to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    app_name: "{{ app_name | default('demo-api') }}"
    namespace: "{{ namespace | default('platform-apps') }}"
    image: "{{ image | default('nginx:1.27-alpine') }}"
    replicas: "{{ replicas | default(2) | int }}"
    manifest_dir: "{{ playbook_dir }}/../k8s"
  tasks:
    - name: Ensure namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ namespace }}"
            labels:
              app.kubernetes.io/managed-by: ansible-awx

    - name: Render + apply Deployment
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'deployment.yaml.j2') | from_yaml }}"

    - name: Apply Service from template
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'service.yaml.j2') | from_yaml }}"

    - name: Show result
      debug:
        msg: "Deployed {{ app_name }} ({{ image }}) x{{ replicas }} into {{ namespace }}"
